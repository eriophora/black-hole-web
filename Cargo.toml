[package]
name = "black_hole_web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "24.0", default-features = false, features = ["webgpu", "wgsl"] }
winit = { version = "0.30", features = ["rwh_06"] }
egui = "0.31"
egui-wgpu = { version = "0.31", default-features = false }
egui-winit = { version = "0.31", default-features = false, features = ["links"] }
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1.21", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
web-time = "1.1"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1.0"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "HtmlElement",
    "CssStyleDeclaration",
    "Url",
    "Blob",
    "BlobPropertyBag",
    "console",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
